name: Atrangi Workspace Android + Website

on:
  pull_request:
    branches: [main]
    paths:
      - 'atrangi-document-workspace/**'
      - '.github/workflows/atrangi-workspace-android.yml'
  push:
    branches: [main]
    paths:
      - 'atrangi-document-workspace/seed-xz/**'
      - '.github/workflows/atrangi-workspace-android.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Reconstruct source package
        shell: bash
        run: |
          set -euo pipefail
          cat atrangi-document-workspace/seed-xz/part-*.b64 > /tmp/atrangi-project.b64
          base64 -d /tmp/atrangi-project.b64 > /tmp/atrangi-project.tar.xz
          rm -rf /tmp/atrangi-unpacked
          mkdir -p /tmp/atrangi-unpacked
          tar -xJf /tmp/atrangi-project.tar.xz -C /tmp/atrangi-unpacked
          echo "PROJECT_DIR=/tmp/atrangi-unpacked/Atrangi_Document_Workspace_Android_v1_Lean" >> "$GITHUB_ENV"
      - name: Build Android debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/Atrangi-Document-Workspace-v1-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Atrangi-Document-Workspace-APK
          path: /tmp/Atrangi-Document-Workspace-v1-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Atrangi-Document-Workspace-Source
          path: /tmp/atrangi-project.tar.xz

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Atrangi-Document-Workspace-APK
          path: /tmp/apk
      - name: Reconstruct and publish browsable source
        shell: bash
        run: |
          set -euo pipefail
          cat atrangi-document-workspace/seed-xz/part-*.b64 > /tmp/atrangi-project.b64
          base64 -d /tmp/atrangi-project.b64 > /tmp/atrangi-project.tar.xz
          rm -rf /tmp/atrangi-unpacked
          mkdir -p /tmp/atrangi-unpacked
          tar -xJf /tmp/atrangi-project.tar.xz -C /tmp/atrangi-unpacked
          P=/tmp/atrangi-unpacked/Atrangi_Document_Workspace_Android_v1_Lean
          rm -rf atrangi-document-workspace/source
          mkdir -p atrangi-document-workspace/source atrangi-document-workspace/releases
          cp -R "$P"/. atrangi-document-workspace/source/
          cp /tmp/apk/Atrangi-Document-Workspace-v1-debug.apk atrangi-document-workspace/releases/
          cp /tmp/atrangi-project.tar.xz atrangi-document-workspace/releases/Atrangi-Document-Workspace-v1-Source.tar.xz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atrangi-document-workspace/source atrangi-document-workspace/releases
          git diff --cached --quiet || git commit -m "Publish Atrangi Document Workspace Android v1"
          git push
          rm -rf /tmp/pages
          mkdir -p /tmp/pages
          cp -R "$P/app/src/main/assets/www"/. /tmp/pages/
          touch /tmp/pages/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/pages
      - id: pages
        uses: actions/deploy-pages@v4
