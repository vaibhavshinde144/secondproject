name: Atrangi Scanner CI

on:
  push:
    branches: [ main ]
    paths:
      - 'atrangi-scanner/**'
      - '.github/workflows/atrangi-scanner-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'atrangi-scanner/**'
      - '.github/workflows/atrangi-scanner-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Run scanner core tests
        working-directory: atrangi-scanner
        run: npm test
      - name: Validate JavaScript syntax
        working-directory: atrangi-scanner
        run: |
          node --check scanner-core.js
          node --check app.js
