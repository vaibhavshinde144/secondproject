name: Android Emulator Launch Test

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-emulator-smoke-test.yml'

permissions:
  contents: read

jobs:
  launch-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK for emulator
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Install emulator image and enable KVM
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "system-images;android-30;google_apis;x86_64"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          echo no | avdmanager create avd --force --name AtrangiApi30 --package "system-images;android-30;google_apis;x86_64" --device "pixel_2"

      - name: Start emulator, install and launch Atrangi Ledger
        shell: bash
        run: |
          set -u
          mkdir -p emulator-evidence
          "$ANDROID_SDK_ROOT/emulator/emulator" @AtrangiApi30 \
            -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect \
            > emulator-evidence/emulator-boot.txt 2>&1 &
          emulator_pid=$!
          echo "$emulator_pid" > emulator-evidence/emulator-pid.txt

          adb wait-for-device
          if ! timeout 360 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 5; done'; then
            echo 'emulator_boot_code=1' > emulator-evidence/smoke-status.txt
            adb devices -l > emulator-evidence/adb-devices.txt 2>&1 || true
            exit 1
          fi
          echo 'emulator_boot_code=0' > emulator-evidence/smoke-status.txt

          adb shell settings put global window_animation_scale 0 || true
          adb shell settings put global transition_animation_scale 0 || true
          adb shell settings put global animator_duration_scale 0 || true
          adb shell 'echo "chrome --disable-fre --no-default-browser-check" > /data/local/tmp/chrome-command-line' || true

          if adb install -r app/build/outputs/apk/debug/app-debug.apk > emulator-evidence/install-result.txt 2>&1; then
            echo 'install_code=0' >> emulator-evidence/smoke-status.txt
          else
            echo 'install_code=1' >> emulator-evidence/smoke-status.txt
          fi

          adb logcat -c
          if adb shell am start -W -n com.atrangiriders.ledger/.SafeLauncherActivity > emulator-evidence/launch-result.txt 2>&1; then
            echo 'launch_code=0' >> emulator-evidence/smoke-status.txt
          else
            echo 'launch_code=1' >> emulator-evidence/smoke-status.txt
          fi

          sleep 15
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' > emulator-evidence/resumed-activity.txt 2>&1 || true
          adb shell pidof com.atrangiriders.ledger > emulator-evidence/app-pid.txt 2>&1 || true
          adb exec-out screencap -p > emulator-evidence/emulator-launch.png 2>/dev/null || true
          adb logcat -d -v threadtime > emulator-evidence/emulator-logcat.txt 2>&1 || true
          adb emu kill || true

      - name: Validate launch result
        shell: bash
        run: |
          set -euo pipefail
          cat emulator-evidence/smoke-status.txt
          cat emulator-evidence/install-result.txt
          cat emulator-evidence/launch-result.txt
          cat emulator-evidence/resumed-activity.txt || true
          grep -q 'emulator_boot_code=0' emulator-evidence/smoke-status.txt
          grep -q 'install_code=0' emulator-evidence/smoke-status.txt
          grep -q 'launch_code=0' emulator-evidence/smoke-status.txt
          if grep -E -i 'FATAL EXCEPTION|Unable to start activity|Process: com\.atrangiriders\.ledger.*has died|AndroidRuntime.*com\.atrangiriders\.ledger' emulator-evidence/emulator-logcat.txt; then
            echo 'Atrangi Ledger launch crash detected in emulator logcat.'
            grep -E -i -C 10 'FATAL EXCEPTION|Unable to start activity|Process: com\.atrangiriders\.ledger.*has died|AndroidRuntime.*com\.atrangiriders\.ledger' emulator-evidence/emulator-logcat.txt
            exit 1
          fi

      - name: Upload emulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Atrangi-Ledger-v1.2.2-emulator-evidence
          path: emulator-evidence/
          if-no-files-found: error
          retention-days: 30
