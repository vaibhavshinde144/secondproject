name: Android Emulator Launch Test

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-emulator-smoke-test.yml'

permissions:
  contents: read

jobs:
  launch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK for emulator
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and launch Atrangi Ledger
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euxo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.atrangiriders.ledger/com.google.androidbrowserhelper.trusted.LauncherActivity | tee launch-result.txt
            sleep 12
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | tee resumed-activity.txt || true
            adb exec-out screencap -p > emulator-launch.png
            adb logcat -d -v threadtime > emulator-logcat.txt
            if grep -E -i 'FATAL EXCEPTION|Unable to start activity|Process: com\.atrangiriders\.ledger.*has died' emulator-logcat.txt; then
              echo 'Atrangi Ledger launch crash detected.'
              exit 1
            fi
            if grep -E -i 'Error type 3|Activity class .* does not exist' launch-result.txt; then
              echo 'Launcher activity did not start.'
              exit 1
            fi

      - name: Upload emulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Atrangi-Ledger-v1.2.0-emulator-evidence
          path: |
            emulator-launch.png
            emulator-logcat.txt
            launch-result.txt
            resumed-activity.txt
          if-no-files-found: warn
          retention-days: 30
