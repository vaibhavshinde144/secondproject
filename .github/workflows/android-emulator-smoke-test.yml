name: Android Emulator Launch Test

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-emulator-smoke-test.yml'

permissions:
  contents: read

jobs:
  launch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK for emulator
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator and collect launch evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set +e
            adb install -r app/build/outputs/apk/debug/app-debug.apk > install-result.txt 2>&1
            install_code=$?
            adb logcat -c
            adb shell monkey -p com.atrangiriders.ledger -c android.intent.category.LAUNCHER 1 > launch-result.txt 2>&1
            launch_code=$?
            sleep 12
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' > resumed-activity.txt 2>&1
            adb exec-out screencap -p > emulator-launch.png 2>/dev/null
            adb logcat -d -v threadtime > emulator-logcat.txt 2>&1
            printf 'install_code=%s\nlaunch_code=%s\n' "$install_code" "$launch_code" > smoke-status.txt
            exit 0

      - name: Validate launch result
        shell: bash
        run: |
          set -euo pipefail
          cat smoke-status.txt
          cat install-result.txt
          cat launch-result.txt
          cat resumed-activity.txt || true
          grep -q 'install_code=0' smoke-status.txt
          grep -q 'launch_code=0' smoke-status.txt
          if grep -E -i 'FATAL EXCEPTION|Unable to start activity|Process: com\.atrangiriders\.ledger.*has died|AndroidRuntime.*com\.atrangiriders\.ledger' emulator-logcat.txt; then
            echo 'Atrangi Ledger launch crash detected in emulator logcat.'
            grep -E -i -C 8 'FATAL EXCEPTION|Unable to start activity|Process: com\.atrangiriders\.ledger.*has died|AndroidRuntime.*com\.atrangiriders\.ledger' emulator-logcat.txt
            exit 1
          fi

      - name: Upload emulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Atrangi-Ledger-v1.2.0-emulator-evidence
          path: |
            emulator-launch.png
            emulator-logcat.txt
            install-result.txt
            launch-result.txt
            resumed-activity.txt
            smoke-status.txt
          if-no-files-found: error
          retention-days: 30
