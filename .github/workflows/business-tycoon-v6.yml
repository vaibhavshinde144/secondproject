name: Build Business Tycoon v6 APK

on:
  push:
    branches: [business-tycoon-v6]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reconstruct and verify v6 game
        shell: bash
        run: |
          set -e
          ASSETS="$GITHUB_WORKSPACE/business-tycoon-v4-android/app/src/main/assets"
          cat "$ASSETS"/chunks/part*.b64 | base64 -d | gzip -d > /tmp/v4-base.html
          cat "$GITHUB_WORKSPACE"/business-tycoon-v5/extra/part*.b64 | base64 -d | gzip -d > /tmp/v5-extra.html
          cat \
            "$GITHUB_WORKSPACE"/business-tycoon-v6/extra/part01.b64 \
            "$GITHUB_WORKSPACE"/business-tycoon-v6/extra/part02a.b64 \
            "$GITHUB_WORKSPACE"/business-tycoon-v6/extra/part02b.b64 \
            "$GITHUB_WORKSPACE"/business-tycoon-v6/extra/part03.b64 \
            "$GITHUB_WORKSPACE"/business-tycoon-v6/extra/part04.b64 \
            | base64 -d | gzip -d > /tmp/v6-extra.html
          echo "115210d84ac380a483dc2e713704c1d260655db6161e3258c995065790cca407  /tmp/v6-extra.html" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          base = Path('/tmp/v4-base.html').read_text(encoding='utf-8')
          v5 = Path('/tmp/v5-extra.html').read_text(encoding='utf-8')
          v6 = Path('/tmp/v6-extra.html').read_text(encoding='utf-8')
          ending = '</body></html>'
          assert base.endswith(ending), 'v4 HTML ending not found'
          full_v5 = base[:-len(ending)] + v5 + ending
          out = full_v5[:-len(ending)] + "\n" + v6 + "\n" + ending
          target = Path('business-tycoon-v4-android/app/src/main/assets/index.html')
          target.write_text(out, encoding='utf-8')
          assert target.stat().st_size > 200000, 'Reconstructed v6 game is unexpectedly small'
          text = target.read_text(encoding='utf-8')
          required = ['Personal-Use Portfolio','Loans & Credit','World Territories','Average Buy','Realized P/L']
          missing = [x for x in required if x not in text]
          assert not missing, f'Missing v6 features: {missing}'
          PY
          rm -rf "$ASSETS/chunks"
          test -s "$ASSETS/index.html"

      - name: Build Android APK
        working-directory: business-tycoon-v4-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp business-tycoon-v4-android/app/build/outputs/apk/debug/app-debug.apk Business-Tycoon-v6.0.0.apk

      - name: Verify APK archive and v6 features
        run: |
          unzip -t Business-Tycoon-v6.0.0.apk
          unzip -p Business-Tycoon-v6.0.0.apk assets/index.html > /tmp/apk-index.html
          test -s /tmp/apk-index.html
          grep -q "Personal-Use Portfolio" /tmp/apk-index.html
          grep -q "Loans & Credit" /tmp/apk-index.html
          grep -q "World Territories" /tmp/apk-index.html
          grep -q "Average Buy" /tmp/apk-index.html
          grep -q "Realized P/L" /tmp/apk-index.html
          sha256sum Business-Tycoon-v6.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Business-Tycoon-v6-Android-APK
          path: Business-Tycoon-v6.0.0.apk
          if-no-files-found: error
