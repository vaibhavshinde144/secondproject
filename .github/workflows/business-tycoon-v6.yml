name: Build Business Tycoon v6 APK

on:
  push:
    branches: [business-tycoon-v6]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reconstruct and verify v6 game
        shell: bash
        run: |
          set -e
          ASSETS="$GITHUB_WORKSPACE/business-tycoon-v4-android/app/src/main/assets"
          cat "$ASSETS"/chunks/part*.b64 | base64 -d | gzip -d > /tmp/v4-base.html
          cat "$GITHUB_WORKSPACE"/business-tycoon-v5/extra/part*.b64 | base64 -d | gzip -d > /tmp/v5-extra.html
          cat "$GITHUB_WORKSPACE"/business-tycoon-v6/extra/part*.b64 | base64 -d | gzip -d > /tmp/v6-extra.html
          echo "115210d84ac380a483dc2e713704c1d260655db6161e3258c995065790cca407  /tmp/v6-extra.html" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          base = Path('/tmp/v4-base.html').read_text(encoding='utf-8')
          v5 = Path('/tmp/v5-extra.html').read_text(encoding='utf-8')
          v6 = Path('/tmp/v6-extra.html').read_text(encoding='utf-8')
          ending = '</body></html>'
          assert base.endswith(ending), 'v4 HTML ending not found'
          full_v5 = base[:-len(ending)] + v5 + ending
          assert full_v5.endswith(ending), 'v5 HTML ending not found'
          out = full_v5[:-len(ending)] + "\n" + v6 + "\n" + ending
          Path('business-tycoon-v4-android/app/src/main/assets/index.html').write_text(out, encoding='utf-8')
          PY
          echo "28c5816406c5adb2e577cd5c44972706ef5837da47987e18e39b050d9f2a6795  $ASSETS/index.html" | sha256sum -c -
          rm -rf "$ASSETS/chunks"
          test -s "$ASSETS/index.html"

      - name: Build Android APK
        working-directory: business-tycoon-v4-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp business-tycoon-v4-android/app/build/outputs/apk/debug/app-debug.apk Business-Tycoon-v6.0.0.apk

      - name: Verify APK archive
        run: |
          unzip -t Business-Tycoon-v6.0.0.apk
          test "$(unzip -p Business-Tycoon-v6.0.0.apk assets/index.html | sha256sum | awk '{print $1}')" = "28c5816406c5adb2e577cd5c44972706ef5837da47987e18e39b050d9f2a6795"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Business-Tycoon-v6-Android-APK
          path: Business-Tycoon-v6.0.0.apk
          if-no-files-found: error
