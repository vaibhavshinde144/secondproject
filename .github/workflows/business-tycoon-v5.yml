name: Build Business Tycoon v5 APK

on:
  push:
    branches: [business-tycoon-v5]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Reconstruct and verify v5 game
        shell: bash
        run: |
          set -e
          ASSETS="$GITHUB_WORKSPACE/business-tycoon-v4-android/app/src/main/assets"
          cat "$ASSETS"/chunks/part*.b64 | base64 -d | gzip -d > /tmp/v4-base.html
          cat "$GITHUB_WORKSPACE"/business-tycoon-v5/extra/part*.b64 | base64 -d | gzip -d > /tmp/v5-extra.html
          echo "8ff0441ebe5bfcd0e8a3665d1137311bff1829e0050966a2515f7b1c2bac1642  /tmp/v5-extra.html" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          base = Path('/tmp/v4-base.html').read_text(encoding='utf-8')
          extra = Path('/tmp/v5-extra.html').read_text(encoding='utf-8')
          ending = '</body></html>'
          assert base.endswith(ending), 'v4 HTML ending not found'
          out = base[:-len(ending)] + extra + ending
          Path('business-tycoon-v4-android/app/src/main/assets/index.html').write_text(out, encoding='utf-8')
          PY
          echo "b01a00742c71a8b89bc9d28ebd2594de427b976811f63049a23a2d244e18a46e  $ASSETS/index.html" | sha256sum -c -
          rm -rf "$ASSETS/chunks"
          test -s "$ASSETS/index.html"

      - name: Build Android APK
        working-directory: business-tycoon-v4-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp business-tycoon-v4-android/app/build/outputs/apk/debug/app-debug.apk Business-Tycoon-v5.0.0.apk

      - name: Verify APK archive
        run: |
          unzip -t Business-Tycoon-v5.0.0.apk
          unzip -p Business-Tycoon-v5.0.0.apk assets/index.html | sha256sum

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Business-Tycoon-v5-Android-APK
          path: Business-Tycoon-v5.0.0.apk
          if-no-files-found: error
