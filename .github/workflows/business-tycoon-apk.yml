name: Build Business Tycoon APK

on:
  push:
    branches: [business-tycoon-apk]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Android project
        shell: bash
        run: |
          set -e
          ROOT="$GITHUB_WORKSPACE/business-tycoon-build"
          mkdir -p "$ROOT/app/src/main/java/com/aurelius/businesstycoon"
          mkdir -p "$ROOT/app/src/main/res/values" "$ROOT/app/src/main/res/drawable" "$ROOT/app/src/main/assets"

          cat > "$ROOT/settings.gradle" <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'BusinessTycoon'
          include ':app'
          EOF

          cat > "$ROOT/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > "$ROOT/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.aurelius.businesstycoon'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.aurelius.businesstycoon'
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName '2.0.0'
              }
              buildTypes {
                  debug { minifyEnabled false }
                  release { minifyEnabled false }
              }
          }
          EOF

          cat > "$ROOT/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:icon="@drawable/ic_launcher"
                android:label="Business Tycoon"
                android:theme="@style/AppTheme"
                android:usesCleartextTraffic="false">
              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:screenOrientation="portrait">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > "$ROOT/app/src/main/res/values/styles.xml" <<'EOF'
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:windowLightStatusBar">false</item>
              <item name="android:windowLightNavigationBar">false</item>
              <item name="android:statusBarColor">#0B132B</item>
              <item name="android:navigationBarColor">#070B14</item>
              <item name="android:windowBackground">#0B132B</item>
              <item name="android:colorAccent">#00E676</item>
            </style>
          </resources>
          EOF

          cat > "$ROOT/app/src/main/res/drawable/ic_launcher.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0B132B" android:pathData="M0,0h108v108h-108z"/>
            <path android:fillColor="#00E676" android:pathData="M22,29h64v11h-64zM27,45h54v35h-10v-24h-12v24h-10v-24h-12v24h-10zM19,84h70v8h-70z"/>
            <path android:fillColor="#FFFFFF" android:pathData="M32,20h44l9,9h-62z"/>
          </vector>
          EOF

          cat > "$ROOT/app/src/main/java/com/aurelius/businesstycoon/MainActivity.java" <<'EOF'
          package com.aurelius.businesstycoon;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.View;
          import android.view.Window;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
            private WebView webView;

            @Override
            public void onCreate(Bundle state) {
              super.onCreate(state);

              Window window = getWindow();
              window.setStatusBarColor(Color.rgb(11, 19, 43));
              window.setNavigationBarColor(Color.rgb(7, 11, 20));
              window.getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);

              webView = new WebView(this);
              webView.setBackgroundColor(Color.rgb(11, 19, 43));
              webView.setOverScrollMode(View.OVER_SCROLL_NEVER);
              webView.setVerticalScrollBarEnabled(false);
              webView.setHorizontalScrollBarEnabled(false);

              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              settings.setDatabaseEnabled(true);
              settings.setAllowFileAccess(true);
              settings.setBuiltInZoomControls(false);
              settings.setDisplayZoomControls(false);
              settings.setTextZoom(100);

              webView.setWebViewClient(new WebViewClient());
              webView.setWebChromeClient(new WebChromeClient());
              webView.loadUrl("file:///android_asset/index.html");
              setContentView(webView);
            }

            @Override
            public void onBackPressed() {
              if (webView != null && webView.canGoBack()) webView.goBack();
              else super.onBackPressed();
            }

            @Override
            protected void onDestroy() {
              if (webView != null) webView.destroy();
              super.onDestroy();
            }
          }
          EOF

          cp "$GITHUB_WORKSPACE/business-tycoon-v2/index.html" "$ROOT/app/src/main/assets/index.html"

      - name: Build APK
        working-directory: business-tycoon-build
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp business-tycoon-build/app/build/outputs/apk/debug/app-debug.apk Business-Tycoon-v2.0.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Business-Tycoon-v2-Android-APK
          path: Business-Tycoon-v2.0.0.apk
          if-no-files-found: error
