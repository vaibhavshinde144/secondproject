<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B132B">
<title>Business Tycoon</title>
<style>
:root{
  --navy:#0B132B;--bg:#060a13;--bg2:#09101d;--card:#111827;--card2:#0c1424;
  --line:#253047;--line2:#1d2739;--muted:#7e8aa3;--muted2:#526079;--green:#00E676;
  --red:#fb7185;--amber:#fbbf24;--blue:#60a5fa;--violet:#a78bfa;--white:#f8fafc;
  --navh:78px
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--white);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:radial-gradient(circle at 90% 0,rgba(0,230,118,.075),transparent 26%),radial-gradient(circle at 5% 20%,rgba(96,165,250,.05),transparent 25%),linear-gradient(180deg,var(--navy),#08101d 32%,var(--bg) 78%)}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--navh) + 30px)}
.top{
  position:sticky;top:0;z-index:15;background:rgba(11,19,43,.97);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(51,65,85,.6);padding:16px 16px 14px
}
.brand{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:11px;user-select:none;touch-action:manipulation}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#6ff2b2,#00E676);display:grid;place-items:center;color:#04120b;font-weight:950;font-size:17px;box-shadow:0 0 28px rgba(0,230,118,.14)}
.brand-copy{min-width:0}
.brand h1{font-size:15px;line-height:1.2;margin:0;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{border:1px solid rgba(0,230,118,.22);background:rgba(0,230,118,.05);color:var(--green);padding:6px 9px;border-radius:999px;font-size:9px;font-weight:900;letter-spacing:.6px}
.resources{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:13px}
.res{min-width:0;background:rgba(17,24,39,.78);border:1px solid rgba(51,65,85,.62);border-radius:14px;padding:9px 5px;text-align:center}
.res b{display:block;font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res.positive b{color:var(--green)}
.res.negative b{color:var(--red)}
.res span{display:block;margin-top:4px;font-size:8px;color:#667085;text-transform:uppercase;letter-spacing:.45px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{padding:16px}
.flow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;border:1px solid rgba(0,230,118,.13);background:linear-gradient(110deg,rgba(0,230,118,.06),rgba(0,230,118,.018));padding:14px 15px;border-radius:20px;margin-bottom:20px;box-shadow:inset 0 0 30px rgba(0,230,118,.015)}
.flow small,.eyebrow{font-size:9px;color:#7f8da6;text-transform:uppercase;letter-spacing:1.7px;font-weight:650}
.flow strong{display:block;color:var(--green);margin-top:5px;font-size:19px;line-height:1.1}
.pill{font-size:9px;border:1px solid #334155;border-radius:999px;padding:7px 9px;color:#cbd5e1;white-space:nowrap}
.section{margin-bottom:21px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:10px}
.section h2{font-size:19px;line-height:1.2;margin:4px 0 0;font-weight:900;letter-spacing:-.25px}
.section-action{font-size:10px;color:var(--green);background:rgba(0,230,118,.06);border:1px solid rgba(0,230,118,.13);padding:6px 9px;border-radius:10px}
.card{background:linear-gradient(180deg,rgba(20,29,50,.96),rgba(12,20,36,.96));border:1px solid rgba(79,93,119,.28);border-radius:21px;padding:14px;box-shadow:0 16px 48px rgba(0,0,0,.2);margin-bottom:10px;overflow:hidden}
.card.soft{background:linear-gradient(180deg,rgba(15,23,42,.8),rgba(9,15,27,.86))}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.metric{min-width:0;background:rgba(2,6,23,.34);border:1px solid rgba(51,65,85,.58);border-radius:16px;padding:12px}
.metric span{font-size:9px;color:#6f7b91;text-transform:uppercase;letter-spacing:.5px}
.metric b{display:block;margin-top:8px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.green{color:var(--green)!important}.red{color:var(--red)!important}.amber{color:var(--amber)!important}
.row{display:flex;align-items:center;gap:11px;min-width:0}
.grow{flex:1;min-width:0}
.row h3{font-size:13px;margin:0;font-weight:800}
.row p{font-size:10px;line-height:1.45;color:var(--muted);margin:4px 0 0}
.icon{width:42px;height:42px;flex:0 0 42px;border-radius:14px;background:#1b2941;display:grid;place-items:center;font-size:19px}
.icon.greenbg{background:rgba(0,230,118,.09)}
.btn{border:0;border-radius:12px;padding:10px 12px;font-weight:900;font-size:10px;line-height:1.15;transition:transform .08s ease,opacity .2s ease;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--green);color:#05120b}
.btn.dark{background:#f8fafc;color:#0f172a}
.btn.outline{background:#111827;border:1px solid #334155;color:#f8fafc}
.btn.ghost{background:rgba(148,163,184,.06);border:1px solid rgba(148,163,184,.12);color:#cbd5e1}
.btn.danger{background:rgba(251,113,133,.08);border:1px solid rgba(251,113,133,.2);color:#fda4af}
.btn:disabled{opacity:.42;cursor:not-allowed}
.wide{width:100%;margin-top:11px}
.statement{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:10.5px;border-bottom:1px solid rgba(51,65,85,.42)}
.statement:last-child{border-bottom:0}.statement span{color:#8895aa}.statement b{text-align:right}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid #2d3a51;background:#0f172a;color:#8f9cb1;border-radius:999px;padding:8px 11px;font-size:9px;font-weight:800;white-space:nowrap}
.chip.active{background:rgba(0,230,118,.09);border-color:rgba(0,230,118,.23);color:var(--green)}
.hero-map{height:122px;border-radius:16px;border:1px solid #1f2937;background:radial-gradient(circle at 25% 45%,rgba(0,230,118,.16),transparent 20%),radial-gradient(circle at 70% 35%,rgba(96,165,250,.14),transparent 25%),linear-gradient(145deg,#121d35,#0a1020);position:relative;overflow:hidden;padding:13px;display:flex;align-items:flex-end}
.hero-map:before{content:"";position:absolute;inset:0;opacity:.25;background-image:linear-gradient(rgba(148,163,184,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.09) 1px,transparent 1px);background-size:22px 22px}
.hero-map>div{position:relative}
.territory-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.territory{min-width:0}.territory .code{width:38px;height:38px;border-radius:12px;background:#1e293b;display:grid;place-items:center;font-weight:950;font-size:11px}
.territory.unlocked .code{background:rgba(0,230,118,.10);color:var(--green)}
.territory h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asset-card .asset-top{display:flex;gap:10px;align-items:flex-start}
.asset-values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:11px}
.mini{background:rgba(2,6,23,.3);border:1px solid rgba(51,65,85,.45);border-radius:11px;padding:8px;min-width:0}
.mini span{display:block;font-size:7.5px;color:#68758c;text-transform:uppercase}.mini b{display:block;margin-top:5px;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.action-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:10px}.action-row.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.action-row .btn{padding:10px 5px;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.badge{font-size:8px;padding:5px 7px;border-radius:999px;background:rgba(96,165,250,.07);border:1px solid rgba(96,165,250,.16);color:#93c5fd}
.badge.good{background:rgba(0,230,118,.07);border-color:rgba(0,230,118,.16);color:#6ee7b7}
.progress{height:6px;border-radius:999px;background:#111827;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:linear-gradient(90deg,#00E676,#5ee9a8);border-radius:inherit}
.market-card{padding:13px 13px 12px}.market-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.market-price{text-align:right}.price{font-size:16px;font-weight:950}.change{font-size:9px;font-weight:850;margin-top:3px}.change.up{color:var(--green)}.change.down{color:var(--red)}
.chart-wrap{margin-top:12px;background:rgba(2,6,23,.32);border:1px solid rgba(51,65,85,.45);border-radius:14px;padding:8px}
.chart-meta{display:flex;justify-content:space-between;font-size:8px;color:#69768c;margin-bottom:4px}
svg.spark{display:block;width:100%;height:86px;overflow:visible}.spark .grid{stroke:#26334a;stroke-width:.6}.spark .lineUp{fill:none;stroke:#00E676;stroke-width:2.2}.spark .lineDown{fill:none;stroke:#fb7185;stroke-width:2.2}.spark .areaUp{fill:url(#gup)}.spark .areaDown{fill:url(#gdown)}
.inventory{display:flex;justify-content:space-between;gap:8px;background:rgba(2,6,23,.3);padding:8px 10px;border-radius:10px;margin-top:9px;font-size:9px;color:var(--muted)}
.qty-row{display:grid;grid-template-columns:36px 1fr 36px;gap:6px;align-items:center;margin-top:8px}.qty-row button{height:34px;border-radius:10px;border:1px solid #334155;background:#111827;color:white;font-size:16px}.qty{height:34px;display:grid;place-items:center;background:#0b1220;border:1px solid #273449;border-radius:10px;font-size:10px;font-weight:900}
.trade-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
.settings-group{margin-bottom:16px}.settings-label{font-size:9px;color:#718096;text-transform:uppercase;letter-spacing:1.3px;margin-bottom:7px}
.select{width:100%;background:#0b1220;border:1px solid #334155;color:white;border-radius:12px;padding:11px;outline:none}
.option-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.option{border:1px solid #2a374d;background:#0d1525;color:#bac4d4;border-radius:12px;padding:10px;font-size:10px;text-align:left}.option.active{border-color:rgba(0,230,118,.35);background:rgba(0,230,118,.07);color:var(--green)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.switch{width:48px;height:27px;border-radius:999px;background:#334155;position:relative;flex:0 0 48px}.switch.on{background:var(--green)}.switch:after{content:"";width:19px;height:19px;background:white;border-radius:50%;position:absolute;top:4px;left:4px;transition:.2s}.switch.on:after{left:25px}
.event{border-left:3px solid var(--amber);padding-left:10px}.event.good{border-left-color:var(--green)}.event.bad{border-left-color:var(--red)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;height:var(--navh);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(7,11,20,.98);border-top:1px solid #1f2937;padding:7px 7px 9px;z-index:20;box-shadow:0 -14px 36px rgba(0,0,0,.22)}
.nav button{min-width:0;border:0;background:transparent;color:#667085;padding:8px 2px;border-radius:13px;font-size:8.5px;font-weight:850;line-height:1.35;overflow:hidden}.nav button .ni{display:block;font-size:16px;line-height:1.2;margin-bottom:2px}.nav button.active{background:rgba(0,230,118,.08);color:var(--green)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:40;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px)}.modal.show{display:flex}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:#0a1020;border:1px solid #334155;border-radius:28px 28px 0 0;padding:18px 16px 24px}.sheethead{display:flex;align-items:center;gap:10px;position:sticky;top:-18px;background:#0a1020;padding:18px 0 12px;z-index:2}.sheethead h2{margin:0;font-size:18px}.close{margin-left:auto;background:#1e293b;border:0;color:white;width:38px;height:38px;border-radius:11px}
.inject{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;margin-top:9px}.inject input{min-width:0;background:#020617;border:1px solid #334155;color:white;border-radius:11px;padding:10px}
.toast{position:fixed;left:50%;bottom:calc(var(--navh) + 10px);transform:translateX(-50%);max-width:88vw;background:#020617;border:1px solid #334155;padding:9px 13px;border-radius:11px;font-size:10px;z-index:60;display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 12px 28px rgba(0,0,0,.35)}.toast.show{display:block}
@media(max-width:360px){
 .top{padding-left:12px;padding-right:12px}.content{padding-left:12px;padding-right:12px}.brand{grid-template-columns:40px minmax(0,1fr) auto}.logo{width:40px;height:40px}.resources{gap:5px}.res{padding:8px 3px}.res b{font-size:10px}.metrics{gap:7px}.metric{padding:10px}.flow strong{font-size:17px}.btn{font-size:9px}.territory-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand" id="brand">
    <div class="logo">BT</div>
    <div class="brand-copy">
      <h1 id="companyName">Aurelius Capital</h1>
      <div class="sub"><span id="rank">Rising Mogul</span> · Level <span id="level">7</span></div>
    </div>
    <div class="live">LIVE</div>
  </div>
  <div class="resources">
    <div class="res" id="cashBox"><b id="cashVal"></b><span>Cash</span></div>
    <div class="res positive"><b id="worthVal"></b><span>Net Worth</span></div>
    <div class="res"><b id="coinsVal"></b><span>Gold</span></div>
    <div class="res"><b id="diamondsVal"></b><span>Diamonds</span></div>
  </div>
</header>

<main class="content">
  <div class="flow">
    <div><small>Passive Cash Flow</small><strong id="flowVal"></strong></div>
    <div class="pill" id="cycleLabel">5 sec cycle</div>
  </div>
  <div id="view"></div>
</main>

<nav class="nav">
  <button data-tab="company" class="active"><span class="ni">🏢</span>Company</button>
  <button data-tab="assets"><span class="ni">🏠</span>Assets</button>
  <button data-tab="business"><span class="ni">🏭</span>Business</button>
  <button data-tab="market"><span class="ni">📈</span>Market</button>
  <button data-tab="settings"><span class="ni">⚙️</span>Settings</button>
</nav>
</div>

<div class="modal" id="adminModal">
  <div class="sheet">
    <div class="sheethead">
      <div class="icon">🔐</div>
      <div><div class="eyebrow" style="color:#c4b5fd">God Mode</div><h2>Developer Admin Suite</h2></div>
      <button class="close" onclick="closeAdmin()">✕</button>
    </div>
    <div class="card">
      <b>Resource Injection</b>
      <div class="inject"><input id="cashIn" type="number" inputmode="decimal" placeholder="Add Cash"><button class="btn" style="background:#8b5cf6;color:#fff" onclick="inject('cash','cashIn')">Inject</button></div>
      <div class="inject"><input id="coinIn" type="number" inputmode="decimal" placeholder="Add Gold Coins"><button class="btn" style="background:#8b5cf6;color:#fff" onclick="inject('goldCoins','coinIn')">Inject</button></div>
      <div class="inject"><input id="diaIn" type="number" inputmode="decimal" placeholder="Add Diamonds"><button class="btn" style="background:#8b5cf6;color:#fff" onclick="inject('diamonds','diaIn')">Inject</button></div>
    </div>
    <div class="card toggle-row">
      <div><b>Instant Completion Engine</b><p style="font-size:10px;color:#7f8ba3;margin:4px 0 0">Executes passive cycles every 100 ms.</p></div>
      <div id="adminSwitch" class="switch" onclick="toggleInstant()"></div>
    </div>
    <button class="btn wide danger" onclick="marketFactor(.4,'Global market crash executed')">Force Global Market Crash (-60%)</button>
    <button class="btn wide" style="background:rgba(0,230,118,.07);border:1px solid rgba(0,230,118,.2);color:#6ee7b7" onclick="marketFactor(2.2,'Commodity boom executed')">Force Commodity Boom (+120%)</button>
    <button class="btn wide" style="background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.22);color:#fde68a" onclick="forceDisaster()">Force Disaster Event</button>
    <button class="btn wide" style="background:linear-gradient(90deg,#8b5cf6,#d946ef);color:#fff" onclick="maximize()">👑 Maximize All Levels</button>
    <button class="btn wide outline" onclick="closeAdmin()">Close Admin Suite</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>

function deepCopy(o){return JSON.parse(JSON.stringify(o))}
function loadGame(){
 let x=deepCopy(DEFAULT);
 try{const p=JSON.parse(localStorage.getItem("bt-v2")||localStorage.getItem("bt-mobile")||"{}");x=Object.assign(x,p)}catch(e){}
 x.staff=Object.assign({},DEFAULT.staff,x.staff||{});
 x.inventory=Object.assign({},DEFAULT.inventory,x.inventory||{});
 x.tradeQty=Object.assign({},DEFAULT.tradeQty,x.tradeQty||{});
 x.properties=x.properties||{};x.vehicles=x.vehicles||{};x.businesses=x.businesses||{};
 for(const d of PROP) if(!x.properties[d.name]) x.properties[d.name]={owned:0,rented:0,level:1};
 for(const d of VEH) if(!x.vehicles[d.name]) x.vehicles[d.name]={owned:0,level:1};
 for(const d of BIZ) if(!x.businesses[d.name]) x.businesses[d.name]={owned:0,level:1};
 const migrated={};
 for(const [name,b] of Object.entries(MARKET_BASE)){
   const old=(x.market||{})[name]||{};
   let p=Number(old.p ?? old.price ?? b.p); if(!Number.isFinite(p)||p<=0)p=b.p;
   let history=Array.isArray(old.history)?old.history.map(Number).filter(Number.isFinite).slice(-30):[];
   if(history.length<8){history=[];let cur=p;for(let i=0;i<12;i++){cur=Math.max(b.base*.4,cur*(1+(Math.random()-.5)*b.v*.5));history.push(Number(cur.toFixed(2)))}p=history[history.length-1]}
   migrated[name]={...b,...old,p,prev:Number(old.prev ?? old.previousPrice ?? p),history};
 }
 x.market=migrated;
 return x
}

function fxAmount(usd){return Number(usd||0)*(FX[g.currency]?.r||1)}
function money(usd,compact=false){
 const value=fxAmount(usd),code=g.currency||"USD";
 try{return new Intl.NumberFormat(code==="INR"?"en-IN":"en-US",{style:"currency",currency:code,notation:compact?"compact":"standard",maximumFractionDigits:compact?1:(code==="JPY"?0:(Math.abs(value)<100?2:0))}).format(value)}
 catch(e){return code+" "+value.toFixed(2)}
}
function num(n){return new Intl.NumberFormat("en-US",{maximumFractionDigits:0}).format(Number(n)||0)}
function territoryMult(){return TERR.reduce((m,t)=>g.territories.includes(t.name)?m*t.mult:m,1)}
function staffIncome(){return STAFF.reduce((s,x)=>s+(g.staff[x.name]||0)*x.income,0)}
function companyIncome(){return (g.baseIncome+staffIncome())*(1+g.efficiency*.18)*territoryMult()}
function propertyValueDef(d,state){return d.buy*Math.pow(d.app,Math.max(0,state.level-1))}
function propertyRentDef(d,state){return d.rent*Math.pow(1.24,Math.max(0,state.level-1))}
function propertyIncome(){return PROP.reduce((s,d)=>{const st=g.properties[d.name];return s+st.rented*propertyRentDef(d,st)},0)}
function vehicleValueDef(d,st){return d.buy*Math.pow(1.10,Math.max(0,st.level-1))}
function vehicleIncome(){return VEH.reduce((s,d)=>{const st=g.vehicles[d.name];let bonus=1;if(d.name==="Truck"&&(g.businesses["Logistics Company"]?.owned||0)>0)bonus=1.35;if(d.name==="Private Jet"&&(g.businesses["Airline"]?.owned||0)>0)bonus=1.25;if(d.name==="Yacht"&&(g.businesses["Hotel Chain"]?.owned||0)>0)bonus=1.18;return s+st.owned*d.income*Math.pow(1.16,st.level-1)*bonus},0)}
function bizSynergy(d){
 let bonus=0,active=[];
 for(const [name,pct] of d.links){if((g.businesses[name]?.owned||0)>0){bonus+=pct;active.push([name,pct])}}
 if(d.name==="Logistics Company"&&(g.vehicles["Truck"]?.owned||0)>0){bonus+=.10;active.push(["Truck Fleet",.10])}
 if(d.name==="Airline"&&(g.vehicles["Private Jet"]?.owned||0)>0){bonus+=.08;active.push(["Private Jet",.08])}
 return {mult:1+bonus,active}
}
function businessIncome(){
 return BIZ.reduce((s,d)=>{const st=g.businesses[d.name];if(!st.owned)return s;return s+st.owned*d.income*Math.pow(1.22,st.level-1)*bizSynergy(d).mult},0)*territoryMult()
}
function insurancePremium(){return g.insurance?Math.max(55,netWorth()*.000035):0}
function passiveGross(){return companyIncome()+propertyIncome()+vehicleIncome()+businessIncome()}
function passiveNet(){return passiveGross()-insurancePremium()}
function inventoryValue(){return Object.entries(g.inventory).reduce((s,[k,q])=>s+q*(g.market[k]?.p||0),0)}
function propertyAssets(){return PROP.reduce((s,d)=>{const st=g.properties[d.name];return s+st.owned*propertyValueDef(d,st)},0)}
function vehicleAssets(){return VEH.reduce((s,d)=>{const st=g.vehicles[d.name];return s+st.owned*vehicleValueDef(d,st)},0)}
function businessAssets(){return BIZ.reduce((s,d)=>{const st=g.businesses[d.name];return s+st.owned*d.cost*Math.pow(1.12,st.level-1)},0)}
function companyAssets(){return STAFF.reduce((s,x)=>s+(g.staff[x.name]||0)*x.cost*.75,0)+TERR.reduce((s,t)=>s+(g.territories.includes(t.name)?t.cost:0),0)+g.efficiency*25000}

    <p style="font-size:9px;color:#7e8aa3;line-height:1.5;margin:8px 1px 0">Currency changes display values only. The simulation keeps a USD base ledger so changing currency does not alter your actual wealth.</p>
   </div>
   <div class="settings-group"><div class="settings-label">Simulation Controls</div>
    <div class="toggle-row"><div><b style="font-size:11px">Disaster Insurance</b><p style="font-size:9px;color:#7e8aa3;margin:3px 0 0">70% loss coverage with passive premium.</p></div><div class="switch ${g.insurance?"on":""}" onclick="toggleInsurance()"></div></div>
   </div>
  </div>
 </section>
 <section class="section">${sectionHead("Economy","Government & Risk")}
  <div class="card"><div class="metrics">${metric("Tax Rate",(g.taxRate*100).toFixed(0)+"%")}${metric("Tax Due",money(g.taxDue),g.taxDue?"amber":"green")}${metric("Tax Recovered",money(g.taxRecovered))}${metric("Disaster Loss",money(g.disasterLossTotal),g.disasterLossTotal?"red":"")}</div><button class="btn wide outline" onclick="payTaxNow()">Pay Outstanding Tax</button></div>
 </section>
 <section class="section">${sectionHead("Data","Local Game Save")}
  <div class="card"><p style="font-size:10px;color:#7e8aa3;line-height:1.55;margin:0">Your company progress is automatically saved on this device after every transaction and market update.</p><button class="btn wide danger" onclick="resetGame()">Reset Game Data</button></div>
 </section>
 <section class="section">${sectionHead("About","Business Tycoon")}
  <div class="card"><div class="statement"><span>Version</span><b>2.0.0</b></div><div class="statement"><span>Market engine</span><b>5-second random walk</b></div><div class="statement"><span>Economy</span><b>Tax + disaster simulation</b></div><div class="statement"><span>Data</span><b>Offline / local</b></div></div>
 </section>`
}
function render(){
 header();
 const view=document.getElementById("view");
 view.innerHTML=tab==="company"?companyPage():tab==="assets"?assetsPage():tab==="business"?businessPage():tab==="market"?marketPage():settingsPage();
 save()
}
function withCash(cost,fn,msg="Insufficient cash"){if(g.cash<cost){toast(msg);return false}g.cash-=cost;fn();render();return true}
function hire(name){const d=STAFF.find(x=>x.name===name);withCash(d.cost,()=>g.staff[name]=(g.staff[name]||0)+1)}
function upgradeEfficiency(){const c=55000*Math.pow(1.7,g.efficiency-1);withCash(c,()=>{g.efficiency++;g.level++})}
function unlockTerritory(name){const d=TERR.find(x=>x.name===name);if(g.territories.includes(name))return;withCash(d.cost,()=>{g.territories.push(name);g.level++},"Expansion capital is too low")}
function setAssetMode(v){assetMode=v;render()}
function buyProperty(name){const d=PROP.find(x=>x.name===name),st=g.properties[name];withCash(d.buy,()=>st.owned++)}
function rentOut(name){const st=g.properties[name];if(st.rented>=st.owned)return toast("No vacant unit available");st.rented++;render();toast("Property placed on rent")}
function endRent(name){const st=g.properties[name];if(st.rented<=0)return;st.rented--;render()}
function upgradeProperty(name){const d=PROP.find(x=>x.name===name),st=g.properties[name];if(st.owned<=0)return toast("Purchase this property first");const c=d.upgrade*Math.pow(1.55,st.level-1);withCash(c,()=>st.level++)}
function sellProperty(name){const d=PROP.find(x=>x.name===name),st=g.properties[name];if(st.owned-st.rented<=0)return toast("Vacate a unit before selling");const sale=propertyValueDef(d,st)*.92;st.owned--;g.cash+=sale;render();toast("Property sold")}
function buyVehicle(name){const d=VEH.find(x=>x.name===name),st=g.vehicles[name];withCash(d.buy,()=>st.owned++)}
function upgradeVehicle(name){const d=VEH.find(x=>x.name===name),st=g.vehicles[name];if(st.owned<=0)return toast("Buy this vehicle first");const c=d.upgrade*Math.pow(1.5,st.level-1);withCash(c,()=>st.level++)}
function sellVehicle(name){const d=VEH.find(x=>x.name===name),st=g.vehicles[name];if(st.owned<=0)return;g.cash+=vehicleValueDef(d,st)*d.resale;st.owned--;render();toast("Vehicle sold")}
function setBizFilter(v){bizFilter=v;render()}
function buyBusiness(name){const d=BIZ.find(x=>x.name===name),st=g.businesses[name];withCash(d.cost,()=>{st.owned++;g.level++})}
function upgradeBusiness(name){const d=BIZ.find(x=>x.name===name),st=g.businesses[name];if(st.owned<=0)return toast("Acquire this business first");const c=d.upgrade*Math.pow(1.58,st.level-1);withCash(c,()=>{st.level++;g.level++})}
function sellBusiness(name){const d=BIZ.find(x=>x.name===name),st=g.businesses[name];if(st.owned<=0)return;g.cash+=d.cost*Math.pow(1.12,st.level-1)*.72;st.owned--;render();toast("Business sold")}
function changeQty(name,delta){g.tradeQty[name]=Math.max(1,Math.min(100,(g.tradeQty[name]||1)+delta));render()}
function trade(name,side){const m=g.market[name],q=g.tradeQty[name]||1,total=m.p*q;if(side==="buy"){if(g.cash<total)return toast("Insufficient cash");g.cash-=total;g.inventory[name]+=q}else{if(g.inventory[name]<q)return toast("Not enough inventory");g.inventory[name]-=q;g.cash+=total}render()}
function marketTick(){for(const [name,m] of Object.entries(g.market)){const shock=(Math.random()-.5)*2*m.v,mean=((m.base-m.p)/m.base)*.006,drift=name==="Gold"?.0003:.00015;m.prev=m.p;m.p=Math.max(m.base*.22,m.p*(1+drift+shock+mean));m.history.push(Number(m.p.toFixed(2)));m.history=m.history.slice(-30)}render()}
function accrueCycle(){const gross=passiveGross(),premium=insurancePremium(),net=gross-premium;g.cash+=net;g.totalEarned+=Math.max(0,gross);g.taxDue+=Math.max(0,gross)*g.taxRate;render()}
function restartPassive(){clearInterval(passiveTimer);passiveTimer=setInterval(accrueCycle,g.instant?100:5000)}
function payTaxNow(){if(g.taxDue<=0)return toast("No outstanding tax");const paid=Math.max(0,Math.min(g.cash,g.taxDue));g.cash-=paid;g.taxDue-=paid;g.taxRecovered+=paid;if(g.taxDue>0)toast("Partial tax payment made");else toast("Tax fully paid");render()}
function autoTaxRecovery(){const due=g.taxDue;if(due>0){const paid=Math.max(0,Math.min(g.cash,due));g.cash-=paid;g.taxDue-=paid;g.taxRecovered+=paid;if(g.taxDue>0){g.taxDue*=1.05;toast("Tax recovery partial · 5% penalty added")}else toast("Government tax recovered automatically")}g.lastTaxRecovery=Date.now();render()}
function triggerDisaster(forced=false){
 const d=DISASTERS[Math.floor(Math.random()*DISASTERS.length)],nw=Math.max(50000,Math.abs(netWorth())),gross=Math.min(500000,Math.max(1500,nw*d.sev*(.7+Math.random()*.7))),covered=g.insurance?gross*.70:0,net=gross-covered;
 g.cash-=net;g.disasterLossTotal+=net;g.lastDisaster={...d,grossLoss:gross,covered,netLoss:net,at:Date.now()};render();toast(`${d.emoji} ${d.name}: loss ${money(net)}`)
}
function forceDisaster(){triggerDisaster(true)}
function toggleInsurance(){g.insurance=!g.insurance;render();toast(g.insurance?"Insurance activated":"Insurance cancelled")}
function marketFactor(f,msg){for(const m of Object.values(g.market)){m.prev=m.p;m.p=Math.max(.01,m.p*f);m.history.push(Number(m.p.toFixed(2)));m.history=m.history.slice(-30)}render();toast(msg)}
function inject(field,id){const v=Number(document.getElementById(id).value);if(!Number.isFinite(v)||v<=0)return toast("Enter a positive amount");g[field]+=v;document.getElementById(id).value="";render();toast("Resource injected")}
function toggleInstant(){g.instant=!g.instant;restartPassive();render()}
function maximize(){g.level=100;g.rank="Global Tycoon";g.efficiency=25;g.staff={Analyst:25,Manager:25,Director:25};g.territories=["Home Market",...TERR.map(x=>x.name)];for(const d of PROP)g.properties[d.name]={owned:10,rented:8,level:10};for(const d of VEH)g.vehicles[d.name]={owned:10,level:10};for(const d of BIZ)g.businesses[d.name]={owned:10,level:10};render();toast("All levels maximized")}
function setCurrency(c){if(FX[c])g.currency=c;render();toast(`Currency changed to ${c}`)}
function resetGame(){if(!confirm("Reset all Business Tycoon progress on this device?"))return;localStorage.removeItem("bt-v2");localStorage.removeItem("bt-mobile");g=loadGame();render();restartPassive();toast("Game reset")}
function closeAdmin(){document.getElementById("adminModal").classList.remove("show")}
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("active",x===b));render();window.scrollTo({top:0,behavior:"smooth"})});
const brand=document.getElementById("brand");
brand.onpointerdown=()=>{clearTimeout(pressTimer);pressTimer=setTimeout(()=>{document.getElementById("adminModal").classList.add("show");if(navigator.vibrate)navigator.vibrate(45)},3000)};
["onpointerup","onpointercancel","onpointerleave"].forEach(k=>brand[k]=()=>clearTimeout(pressTimer));
setInterval(marketTick,5000);
setInterval(()=>{const now=Date.now();if(now-g.lastTaxRecovery>=60000)autoTaxRecovery();if(now-g.lastDisasterCheck>=30000){g.lastDisasterCheck=now;if(Math.random()<.18)triggerDisaster();else save()}if(tab==="company"||tab==="settings")render()},1000);
restartPassive();render();
</script>
</body></html>
