import java.awt.RenderingHints
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.atrangiriders.ledger'
    compileSdk 36

    defaultConfig {
        applicationId 'com.atrangiriders.ledger'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.2.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix ''
            debuggable false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
}

// Generate every Android launcher density from the exact maskable logo used by the Atrangi Ledger web app.
def launcherLogoUrl = 'https://atrangi-ledger.web.app/icon-maskable-512.png'
def launcherIconSizes = [mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192]

tasks.register('generateAtrangiLauncherIcons') {
    outputs.upToDateWhen { false }
    outputs.files(launcherIconSizes.collectMany { density, size ->
        [
            file("src/main/res/mipmap-${density}/ic_launcher.png"),
            file("src/main/res/mipmap-${density}/ic_launcher_round.png")
        ]
    })

    doLast {
        BufferedImage sourceLogo
        new URL(launcherLogoUrl).openStream().withCloseable { inputStream ->
            sourceLogo = ImageIO.read(inputStream)
        }
        if (sourceLogo == null) {
            throw new GradleException("Unable to download or decode Atrangi Ledger launcher logo from ${launcherLogoUrl}")
        }

        launcherIconSizes.each { density, size ->
            BufferedImage resized = new BufferedImage(size, size, BufferedImage.TYPE_INT_ARGB)
            def graphics = resized.createGraphics()
            try {
                graphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC)
                graphics.setRenderingHint(RenderingHints.KEY_RENDERING, RenderingHints.VALUE_RENDER_QUALITY)
                graphics.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON)
                graphics.drawImage(sourceLogo, 0, 0, size, size, null)
            } finally {
                graphics.dispose()
            }

            def densityDir = file("src/main/res/mipmap-${density}")
            densityDir.mkdirs()
            ImageIO.write(resized, 'png', new File(densityDir, 'ic_launcher.png'))
            ImageIO.write(resized, 'png', new File(densityDir, 'ic_launcher_round.png'))
        }
    }
}

tasks.matching { it.name == 'preBuild' }.configureEach {
    dependsOn tasks.named('generateAtrangiLauncherIcons')
}
